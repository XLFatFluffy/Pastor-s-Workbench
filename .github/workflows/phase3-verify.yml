name: Phase 3 Verification

on:
  push:
    branches:
      - main
      - 'sync/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run test suite
        run: npm test

      - name: Syntax check core JavaScript
        shell: bash
        run: |
          set -e
          find . -maxdepth 2 -name '*.js' -not -path './node_modules/*' -not -path './src-tauri/target/*' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

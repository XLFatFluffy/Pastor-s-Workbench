name: Build and Publish Pastor's Workbench Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.12.8'
        required: true
        default: '0.12.8'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Prepare desktop frontend
        run: npm run desktop:prepare

      - name: Build and publish signed Tauri release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v${{ github.event.inputs.version || github.ref_name }}
          releaseName: "Pastor's Workbench v${{ github.event.inputs.version || github.ref_name }}"
          releaseBody: "Signed Windows release of Pastor's Workbench."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: false

name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'frontend/**'
      - '*.mjs'
      - 'package.json'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prepare desktop frontend
        run: npm run desktop:prepare

      # This workflow intentionally produces an unsigned test installer.
      # Signed releases use release.yml and TAURI_SIGNING_PRIVATE_KEY.
      - name: Disable updater signing for unsigned build
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8

      - name: Build Windows MSI
        run: npm exec -- tauri build --target x86_64-pc-windows-msvc

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: pastors-workbench-v0.30.0-windows-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload Windows executable bundle
        uses: actions/upload-artifact@v4
        with:
          name: pastors-workbench-v0.30.0-windows-bundle
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
          if-no-files-found: error

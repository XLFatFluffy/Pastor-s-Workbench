name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'frontend/**'
      - '*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Prepare desktop frontend
        run: npm run desktop:prepare

      - name: Build Windows MSI
        run: npm exec -- tauri build --target x86_64-pc-windows-msvc

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: pastors-workbench-v0.30.0-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload Windows executable bundle
        uses: actions/upload-artifact@v4
        with:
          name: pastors-workbench-v0.30.0-windows-bundle
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

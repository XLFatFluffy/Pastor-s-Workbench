[package]
name = "pastors-workbench"
version = "0.12.8"
description = "Pastor's Workbench desktop application"
authors = ["Pastor's Workbench"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pastors_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-updater = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
